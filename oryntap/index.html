<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OrynTap — Find your study spot</title>
  <meta name="description" content="OrynTap shows which study spaces on campus have free seats and power outlets right now.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint (no flash)
    (function () {
      var t = null; try { t = localStorage.getItem("oryntap.theme"); } catch (e) {}
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <a class="sr-only" href="#view">Skip to content</a>

  <header class="topbar">
    <a class="logo" href="#/home" aria-label="OrynTap home">
      <svg viewBox="0 0 24 31" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 0C5.4 0 0 5.2 0 11.7 0 20.2 12 31 12 31s12-10.8 12-19.3C24 5.2 18.6 0 12 0zm0 6.2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg>
      <span>ryn.</span><span class="tap">Tap</span>
    </a>
    <div class="spacer"></div>
    <div class="uni-picker">
      <button class="uni-btn" id="uniBtn" aria-haspopup="listbox" aria-expanded="false">
        <span class="label" id="uniLabel">Choose university</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <ul class="uni-menu" id="uniMenu" role="listbox" hidden></ul>
    </div>
    <button class="theme-toggle" id="themeBtn" aria-label="Switch to dark theme">
      <span class="knob" id="themeKnob"></span>
    </button>
  </header>

  <div class="shell">
    <aside class="sidebar" aria-label="Main navigation">
      <ul class="nav" id="nav"></ul>
    </aside>
    <main class="panel" id="view" tabindex="-1" aria-live="polite"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>
  <div id="modalRoot"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
